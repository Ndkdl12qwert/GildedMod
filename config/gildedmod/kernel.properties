# ============================================================
#  GildedNativeKernel 配置
# ============================================================

# 周期性自愈间隔（单位：tick，20 tick = 1 秒）
#
#  作用：把 com/gildedmod/** 的所有类从 jar 原始字节重建一遍，
#        用来把别的 mod 对我们类的篡改打回原形。
#
#  ⚠⚠ 警告：每次执行会 retransform ~150 个类，会短暂 Stop-The-World，
#         实测游戏会卡 0.2 ~ 1 秒。
#         所以默认关闭（0），只在怀疑被篡改时临时打开。
#
#  推荐值：
#     0      关闭（默认，最流畅）
#     6000   5 分钟一次（偶尔卡一下）
#     12000  10 分钟一次（更省）
#
selfheal.interval=0

# 攻击方法拦截总开关（true = 拦截其它 mod 的攻击型方法）
block.attacks=true

# 「有攻击就废」总开关：true = 任何来源的伤害都无效（除了我们自己的剑）
#   不需要知道是哪个 mod —— 有攻击就废 ✓
block.all.hurt=true

# JVM 本体补丁（把 jvm.dll 的 JVM_Halt / JVM_GC 第一字节改成 ret）
#   true  = 别的 mod 想关服会被拦下；显式 System.gc() 被吞掉
#   false = 不打补丁
kernel.jvm.patch=true
